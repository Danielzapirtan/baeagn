name: Chess

on:
  workflow_dispatch:

jobs:
  bench:
    name: Bench Job
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Preparations
        run: |
          sudo apt update
          sudo apt install gcc jq
          _ICCF=0 _NOEDIT=2 _CHESS960=0 sh bin/build.sh
          chmod 0755 baeagn
      
      - name: Execution
        run: |
          GN=4
          USERNAME=antoniudanielzapirtan
          LTG=43200
          PROCESSORS=2
          ulimit -t $LTG
          for n in $(seq 1 $PROCESSORS); do
            fisher=false sh bin/dlpgn.sh $GN >$GN.txt
            ./baeagn go >$GN.2.txt 2>&1 &
            GN=$(($GN + 1))
          done
          wait
          GN=4
          for n in $(seq 1 $PROCESSORS); do
            cat $GN.txt
            cat $GN.2.txt | tail -n 5
            GN=$(($GN + 1))
          done

